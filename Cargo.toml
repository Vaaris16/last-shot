[package]
name = "last-shot"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = { version = "0.8.0", default-features = false, features = ["2d", "parry-f32"] }
bevy = { version = "0.20.1", features = ["vorbis"] }
rand = "0.10.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

